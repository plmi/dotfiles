[mgr]
show_hidden    = true
show_symlink   = true
ratio          = [1, 3, 4]
scrolloff      = 5
sort_by        = "natural"
sort_dir_first = true
sort_sensitive = false
linemode       = "size"

[preview]
tab_size     = 2
max_width    = 1200
max_height   = 1800
image_filter = "lanczos3"
image_delay  = 30

# git.yazi: show git status next to files (plugin installed via `ya pkg`)
[plugin]
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
